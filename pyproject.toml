[project]
name = "jimmy-maintenance"
version = "0.0.0"
description = "Maintenance scripts for the Jimmy skill package."
requires-python = ">=3.15"

[dependency-groups]
dev = ["ruff", "ty"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.15"
extra-paths = ["scripts"]
